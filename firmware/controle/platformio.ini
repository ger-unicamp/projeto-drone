; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = native

; Comum a todos os envs
[env]
; Código compartilhado entre controle e drone-radio (ex: protocolo)
lib_extra_dirs = ../lib
test_framework = unity

; Placa ainda não definida. Depois de escolher, adicionar o env dela, ex:
; [env:minha_placa]
; platform = <plataforma>   ; pio pkg search / docs.platformio.org/page/boards
; board = <placa>
; framework = <framework>
; monitor_speed = 115200
; build_flags = -Wall -Wextra
; e trocar default_envs acima.

; Testes no PC, sem placa: pio test -e native
; Só testa código que não depende da placa (ex: libs em ../lib)
[env:native]
platform = native
build_flags = -Wall -Wextra
