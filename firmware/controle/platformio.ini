; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32dev

; Comum a todos os envs
[env]
; Código compartilhado entre controle e drone-radio (ex: protocolo)
lib_extra_dirs = ../lib
test_framework = unity

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
build_flags = -Wall -Wextra

; Testes no PC, sem placa: pio test -e native
; Só testa código que não depende de Arduino (ex: libs em ../lib)
[env:native]
platform = native
build_flags = -Wall -Wextra
